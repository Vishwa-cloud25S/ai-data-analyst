# Render.com blueprint - deploys the API and the UI as two services.
# Both run on the free tier; the UI reaches the API over Render's private network.
#
#   1. Push this repo to GitHub
#   2. Render dashboard -> New -> Blueprint -> pick the repo
#   3. Optionally set OPENAI_API_KEY on the api service (it runs fine without)
#
# Note: if a service name is already taken globally, Render appends a suffix
# (ai-data-analyst-api -> ai-data-analyst-api-krvg.onrender.com). The public URL
# changes, but the blueprint's internal fromService wiring is unaffected.
services:
  - type: web
    name: ai-data-analyst-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WAREHOUSE
        value: duckdb
      - key: DUCKDB_PATH
        value: /srv/data/warehouse.duckdb
      - key: MAX_ROWS
        value: "1000"
      # Public demo posture: anonymous callers may ask questions and inspect the
      # validator, but not read the audit log or edit the semantic layer.
      - key: ANONYMOUS_ROLE
        value: analyst
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Set AUTH_ENABLED=true and API_KEYS in the dashboard for a real deployment.
      - key: AUTH_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false          # set in the dashboard; absent = deterministic planner
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: ai-data-analyst-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    plan: free
    autoDeploy: true
    envVars:
      # NOTE: do not use `fromService: property: hostport` here. It resolves to
      # Render's PRIVATE network address (e.g. ai-data-analyst-api-krvg:10000),
      # and free instances cannot use private networking - the UI then fails
      # with "cannot reach the API". Set this to the API service's PUBLIC URL
      # in the dashboard after the first deploy:
      #     https://<your-api-service>.onrender.com
      # Render appends a suffix when the service name is already taken, so the
      # exact hostname is only known once the service exists.
      - key: API_URL
        sync: false
