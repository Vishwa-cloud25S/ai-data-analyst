name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.8.6
      - name: Ruff
        run: ruff check app ui tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Semantic layer executes against the warehouse
        run: |
          python -m app.db.seed
          python -m app.cli check
      - name: CLI smoke test
        run: python -m app.cli ask "revenue by region" --no-llm
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  guardrails:
    name: Security guardrails must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: SQL injection / allow-list suite
        run: pytest tests/test_validator.py tests/test_result_validator.py -q
      - name: End-to-end refusal suite
        run: pytest tests/test_pipeline.py -q -k "refused or dangerous or allowed_tables or limit"

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ai-data-analyst:ci .
      - name: Build UI image
        run: docker build -f Dockerfile.ui -t ai-data-analyst-ui:ci .
      - name: UI image has every dependency it imports
        # Splitting requirements per image once shipped a UI that crashed on
        # `import yaml` because PyYAML was only in the API list. Importing every
        # UI module inside the real image is the check that would have caught it.
        run: |
          docker run --rm -e PYTHONPATH=/srv ai-data-analyst-ui:ci \
            python -c "import ui.api_client, ui.charts, ui.layer_editor; print('ui imports ok')"
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 ai-data-analyst:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          curl -fsS -X POST http://localhost:8000/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What were our highest revenue products last quarter?","use_llm":false}' \
            | tee /tmp/out.json
          grep -q '"status":"answered"' /tmp/out.json
          curl -fsS -X POST http://localhost:8000/ask \
            -H 'content-type: application/json' \
            -d '{"question":"drop table fct_orders","use_llm":false}' | grep -q '"status":"refused"'
          docker rm -f api
