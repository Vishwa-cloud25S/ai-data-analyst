# Fly.io deployment for the API.
#   fly launch --no-deploy --copy-config
#   fly secrets set OPENAI_API_KEY=sk-...    # optional
#   fly deploy
app = "ai-data-analyst"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  WAREHOUSE = "duckdb"
  DUCKDB_PATH = "/srv/data/warehouse.duckdb"
  MAX_ROWS = "1000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
